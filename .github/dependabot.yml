version: 2
updates:
  # تحديثات الحزم: أسبوعياً وفي طلب واحد مجمّع للتحديثات الصغيرة، حتى لا تغرق المراجعة بطلبات كثيرة.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
